name: Build releases

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: win
            ext: .exe
            data_sep: ";"
          - os: ubuntu-latest
            name: linux
            ext: ""
            data_sep: ":"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller openpyxl

      - name: Build with PyInstaller
        run: |
          pyinstaller --name c2000-m-config${{ matrix.ext }} `
            --onefile `
            --add-data "tests/fixtures${{ matrix.data_sep }}tests/fixtures" `
            main.py

      - name: Upload release asset
        if: github.event_name == 'release'
        run: |
          gh release upload ${{ github.event.release.tag_name }} \
            dist/c2000-m-config${{ matrix.ext }} \
            --repo ${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: c2000-m-config-${{ matrix.name }}${{ matrix.ext }}
          path: dist/c2000-m-config${{ matrix.ext }}
