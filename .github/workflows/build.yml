name: Build releases

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller openpyxl

      - name: Build with PyInstaller
        run: |
          pyinstaller --name c2000-m-config.exe `
            --onefile `
            --add-data "tests/fixtures;tests/fixtures" `
            main.py

      - name: Generate SHA256
        run: |
          certutil -hashfile dist\c2000-m-config.exe SHA256 | findstr /v "Hash" | findstr /v "SHA256" > dist/c2000-m-config.exe.sha256
          type dist\c2000-m-config.exe.sha256

      - name: Upload release asset
        if: github.event_name == 'release'
        run: |
          gh release upload ${{ github.event.release.tag_name }} dist/c2000-m-config.exe --repo ${{ github.repository }}
          gh release upload ${{ github.event.release.tag_name }} dist/c2000-m-config.exe.sha256 --repo ${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: c2000-m-config-win.exe
          path: dist/c2000-m-config.exe

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller openpyxl

      - name: Build with PyInstaller
        run: |
          pyinstaller --name c2000-m-config \
            --onefile \
            --add-data "tests/fixtures:tests/fixtures" \
            main.py

      - name: Generate SHA256
        run: |
          sha256sum dist/c2000-m-config > dist/c2000-m-config.sha256
          cat dist/c2000-m-config.sha256

      - name: Upload release asset
        if: github.event_name == 'release'
        run: |
          gh release upload ${{ github.event.release.tag_name }} dist/c2000-m-config --repo ${{ github.repository }}
          gh release upload ${{ github.event.release.tag_name }} dist/c2000-m-config.sha256 --repo ${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: c2000-m-config-linux
          path: dist/c2000-m-config
